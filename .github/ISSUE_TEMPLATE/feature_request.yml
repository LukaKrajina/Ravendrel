name: 功能建议
description: 提出新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解决的问题
      description: 你遇到了什么限制或不便？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 期望的行为或 API 设计
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: 相关组件
      options:
        - 语言 / 编译器 / 语义
        - runtime / C++ 运行时
        - server / CLI
        - client / VSCode 扩展
        - RSP / 仿真平台
        - SE / 编辑器
        - chatWebUI / Web 界面
        - installer / 安装器
        - 文档 / 其他
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你是否考虑过其他解决方式？

  - type: checkboxes
    id: contribution
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交 PR 实现这个功能